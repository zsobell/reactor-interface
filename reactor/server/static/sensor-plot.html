<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensor plot · Reactor Interface</title>
<link rel="stylesheet" href="/static/analysis.css">
<link rel="stylesheet" href="/static/sensor-plot.css">
</head>
<body>
<header>
  <h1 id="sensorTitle">Sensor plot</h1>
  <span class="badge" id="connection">connecting…</span>
</header>
<main>
  <section class="plot">
    <div class="phead">
      <strong id="plotTitle">—</strong>
      <span class="spacer"></span>
      <span id="hoverReadout">Hover over the plot to read a value</span>
    </div>
    <div class="canvasbox"><canvas id="sensorCanvas"></canvas></div>
    <div class="warn" id="plotMessage"></div>
    <div class="settings">
      <div class="ranges" aria-label="Time range">
        <span>Show last</span>
        <button data-window="300">5 min</button>
        <button data-window="900">15 min</button>
        <button data-window="3600" class="active">1 hour</button>
        <span id="manualMode" class="hidden">Custom time range</span>
        <span id="pointCount"></span>
      </div>
      <div class="bounds">
        <label for="xMin">Time from</label><input id="xMin" type="datetime-local" step="1">
        <label for="xMax">to</label><input id="xMax" type="datetime-local" step="1">
      </div>
      <div class="hint">Leave “to” blank to follow new data. Drag across the plot to zoom; hover and use arrow keys to pan or zoom.</div>
      <div class="bounds">
        <label for="yMin" id="yLabel">Value</label><input id="yMin" placeholder="auto min" inputmode="decimal">
        <label for="yMax">to</label><input id="yMax" placeholder="auto max" inputmode="decimal">
        <label class="log"><input id="yLog" type="checkbox"> log scale</label>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/static/sensor-plot.js"></script>
</body>
</html>
