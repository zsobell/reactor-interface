name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python and JavaScript checks
        run: python -m reactor.testing.validate full --require-node
      - name: Compile Python modules
        run: python -m compileall -q reactor tests
